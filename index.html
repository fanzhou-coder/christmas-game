:root{--night:#14213d;--deep:#0b1426;--snow:#f1f5f9;--red:#d62839;--gold:#f4b942;--pine:#2a9d6f;--muted:#9fb0cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--night:#14213d;--deep:#0b1426}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--deep);color:var(--snow);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:720px}
h1{font:16px/1.5 "Press Start 2P",monospace;margin:4px 0 14px;text-align:center;color:var(--gold)}
.stage{position:relative;border:4px solid var(--snow);border-radius:4px;background:var(--night);line-height:0}
canvas{width:100%;height:auto;image-rendering:pixelated;display:block}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(11,20,38,.82);line-height:1.5;text-align:center;padding:16px}
.overlay p{margin:0;max-width:32ch;font-size:16px}
button{font:12px/1.4 "Press Start 2P",monospace;background:var(--red);color:var(--snow);border:0;border-bottom:4px solid #8f1a26;padding:12px 18px;border-radius:4px;cursor:pointer}
button:active{transform:translateY(2px)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{margin-top:14px;background:var(--snow);color:var(--night);border-radius:6px;padding:16px 18px;min-height:96px}
.card p{margin:0;font-size:19px;line-height:1.45;max-width:60ch}
.pips{display:flex;gap:8px;margin-bottom:10px}
.pips i{width:14px;height:14px;border-radius:3px;background:#c4cedd}
.pips i.on{background:var(--red)}
.wishes p+p{margin-top:10px;padding-top:10px;border-top:1px solid #c4cedd;font-size:17px}
.card button{margin-top:14px}
.pad{display:none;justify-content:space-between;margin-top:14px;gap:10px}
.pad button{flex:1;font-size:18px;padding:16px 0;touch-action:none;user-select:none;-webkit-user-select:none}
@media (pointer:coarse){.pad{display:flex}}
.bubble{position:absolute;z-index:3;background:var(--snow);color:var(--night);font-size:15px;line-height:1.35;padding:10px 12px;border-radius:8px;border:3px solid var(--gold);pointer-events:none;transition:opacity .4s;animation:pop .25s ease-out}
.bubble::after{content:"";position:absolute;left:var(--t);bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--gold);border-bottom:0}
.bubble.below::after{bottom:auto;top:-11px;border-top:0;border-bottom:8px solid var(--gold)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.bubble{animation:none}}
@media (max-width:480px){.bubble{font-size:13px;padding:8px 10px}}
.overlay{justify-content:flex-start}
.overlay>:first-child{margin-top:auto}
.overlay>:last-child{margin-bottom:auto}
.overlay .hint{font-size:13px;color:var(--muted)}
.lang{display:flex;gap:8px}
.overlay a{color:var(--gold)}
.lang button{font-size:10px;padding:8px 12px;background:#33415f;border-bottom-color:#1d2740}
.lang button.on{background:var(--red);border-bottom-color:#8f1a26}
#nick{font:16px system-ui,sans-serif;padding:10px 12px;border-radius:4px;border:3px solid var(--snow);background:var(--deep);color:var(--snow);width:min(260px,80%);text-align:center}
#lb{margin-top:12px}
#lb h3{margin:0;font-size:16px}
.lb{list-style:none;margin:6px 0 0;padding:0}
.lb li{display:flex;gap:10px;padding:5px 8px;border-radius:4px;font-size:16px}
.lb li span:first-child{width:2.2ch;text-align:right}
.lb li span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb li.me{background:var(--gold)}
.card .score{font-size:17px;margin-top:6px}
.card .note{font-size:13px;color:#5a6785;margin-top:6px}
@media (max-width:480px){.overlay p{font-size:13px}.overlay{gap:8px;padding:10px}}
.card .rank{font-weight:700;margin-top:8px}
.card summary{cursor:pointer;font-weight:600;margin-top:12px}
.lb li.gap{padding-top:0;padding-bottom:0;color:#5a6785}
.pips{flex-wrap:wrap}
.bubble .lg{display:block;width:50%;height:auto;margin:0 auto 8px}
@media (max-width:480px){.bubble .lg{width:auto;height:22px;margin-bottom:4px}}
footer{text-align:center;color:var(--muted);font-size:14px;margin-top:14px}
@media (max-width:480px){h1{font-size:12px}.card p{font-size:17px}}
</style>
</head>

    if(LB_URL)res=await(await fetch(LB_URL+"?n="+encodeURIComponent(nick)+"&w="+w+"&t="+t,{credentials:"omit",referrerPolicy:"no-referrer"})).json();
    else{
      const rows=local();rows.push({n:nick,w,t});
      const all=agg(rows),i=all.findIndex(x=>x.n.toLowerCase()===nick.toLowerCase());
      try{localStorage.setItem(LK,JSON.stringify(all))}catch(e){}
      res={top:all.slice(0,10),total:all.length,rank:i+1,bw:all[i].w,bt:all[i].t};
    }
  }catch(e){res=null}
  renderLb(res);
}
function end(win){
  running=false;
  bubs.forEach(o=>o.e.remove());bubs=[];
  const w=got.length,t=w?lastT:T;
  const head=win?L("win"):L(left<=0?"time":"out")+" "+L("count",w);
  out.innerHTML='<p style="font-weight:600">'+head+'</p><p class="score">'+L("run")+": <b>"+L("result",w,t.toFixed(1))+'</b></p><div id="lb"><p>'+L("lbload")+"</p></div>"
    +(w?"<details><summary>"+L("wishes",w)+'</summary><div class="wishes">'+got.map(i=>"<p>"+esc(wish(i))+"</p>").join("")+"</div></details>":"")
    +'<button id="again">'+L(win?"again":"retry")+"</button>";
  document.getElementById("again").onclick=()=>{reset();running=true};
  submit(w,t);
}
function loseLife(){
  if(over)return false;
  lives--;inv=100;
  if(lives<=0){over=true;end(false);return false}
  return true;
}
function step(){
  if(!over){left-=1/60;if(left<=0){left=0;over=true;end(false);return}}
  if(inv>0)inv--;fr++;
  const pv=p.y,d=keys.r-keys.l;
  if(d)p.face=d;
  p.x=clamp(p.x+d*3.2,0,LW-p.w);
  if(keys.j&&p.ground)p.vy=-11.5;
  p.vy+=.55;p.y+=p.vy;p.ground=false;
  const c=p.x+p.w/2,pit=pits.find(q=>c+3>q.x&&c-3<q.x+q.w);
  if(!pit&&p.y+p.h>=G){p.y=G-p.h;p.vy=0;p.ground=true}
  if(pit&&p.y+p.h>G+12){
    const q=pit;
    if(loseLife()){p.x=Math.max(0,q.x-70);p.y=G-p.h;p.vy=0}
    return;
  }
  const a0=p.x+21,a1=p.x+31;
  for(const b of bricks){
    if(!b.hit&&b.amp)b.x=b.bx+Math.sin(fr*b.om+b.ph)*b.amp;
    if(a1>b.x+2&&a0<b.x+S-2){
      if(p.vy<0&&pv>=b.y+S&&p.y<b.y+S){p.y=b.y+S;p.vy=1;hit(b)}
      else if(p.vy>=0&&pv+p.h<=b.y&&p.y+p.h>b.y){p.y=b.y-p.h;p.vy=0;p.ground=true}
    }
    if(b.bump>0)b.bump--;
    if(b.hit&&b.grow<1)b.grow=Math.min(1,b.grow+.04);
  }
  for(const f of foes){
    if(!f.alive)continue;
    f.x+=f.d*f.v;
    if(f.x<f.l){f.x=f.l;f.d=1}
    if(f.x>f.r){f.x=f.r;f.d=-1}
    if(p.x+p.w-6>f.x+1&&p.x+6<f.x+27&&p.y+p.h>f.y+4&&p.y<f.y+30){
      if(p.vy>0&&pv+p.h<=f.y+10){f.alive=false;squashed++;p.vy=-8}
      else if(inv<=0&&!over&&loseLife()){p.vy=-6;p.x=clamp(p.x+(p.x<f.x?-40:40),0,LW-p.w)}
    }
  }
  cam=clamp(p.x+p.w/2-W*.4,0,LW-W);
}
function R(c,x,y,w,h){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function snowman(f){
  const x=f.x,y=f.y;
  ctx.fillStyle="#f1f5f9";
  ctx.beginPath();ctx.arc(x+14,y+22,9,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(x+14,y+9,7,0,7);ctx.fill();
  R("#1a1a1a",x+8,y-1,12,3);R("#1a1a1a",x+10,y-6,8,6);
  R("#d62839",x+8,y+15,12,3);
  R("#1a1a1a",x+11,y+7,2,2);R("#1a1a1a",x+15,y+7,2,2);
  R("#f77f00",f.d>0?x+16:x+7,y+10,5,2);
}
function tree(cx,by,g){
  ctx.save();ctx.beginPath();ctx.rect(cx-22,by-70,44,70);ctx.clip();
  const b=by+(1-g)*TH;
  R("#6b4226",cx-3,b-6,6,6);
  for(let i=0;i<3;i++){const w=14-i*3,y=b-6-i*12;ctx.fillStyle=i%2?"#2a9d6f":"#1f7a55";ctx.beginPath();ctx.moveTo(cx-w,y);ctx.lineTo(cx+w,y);ctx.lineTo(cx,y-18);ctx.fill()}
  R("#f4b942",cx-3,b-TH,6,6);R("#d62839",cx-6,b-14,3,3);R("#d62839",cx+3,b-26,3,3);R("#f4b942",cx-2,b-38,3,3);
  ctx.restore();
}
const bgc=document.createElement("canvas");bgc.width=W;bgc.height=H;
const bulbs=[];
function paintBg(){
  const g=bgc.getContext("2d"),r=(c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
  const sky=g.createLinearGradient(0,0,0,G);sky.addColorStop(0,"#0c1530");sky.addColorStop(1,"#2a3f78");
  g.fillStyle=sky;g.fillRect(0,0,W,H);
  for(let i=0;i<50;i++)r("#f1f5f9",Math.random()*W,Math.random()*150,1+(Math.random()<.2),1);
  g.fillStyle="#f6efd0";g.beginPath();g.arc(588,64,15,0,7);g.fill();
  g.fillStyle="#121d3e";g.beginPath();g.arc(595,60,13,0,7);g.fill();
  [[20,240,40],[70,220,34],[240,245,44],[300,215,38],[610,245,30]].forEach(([x,y,w])=>{r("#101c3c",x,y,w,G-y);for(let k=0;k<3;k++)r("#f4b942",x+6+k*10,y+8+(k%2)*12,3,3)});
  const gt="#1c2d58",dm="#18284f";
  r(gt,100,236,140,12);r(gt,106,226,128,10);
  for(let k=0;k<6;k++)r(gt,104+k*25,248,10,52);
  g.fillStyle="rgba(244,185,66,.18)";for(let k=0;k<5;k++)g.fillRect(114+k*25,248,15,52);
  r(gt,152,216,36,10);r(gt,158,206,6,10);r(gt,176,208,6,8);r(gt,166,198,8,18);r("#f4b942",169,194,2,4);
  r(dm,330,262,70,38);g.fillStyle=dm;g.beginPath();g.arc(365,262,24,Math.PI,0);g.fill();
  r(dm,330,248,8,14);r(dm,392,248,8,14);r(dm,361,228,8,12);r("#f4b942",364,214,2,14);r("#f4b942",361,218,8,2);
  for(let k=0;k<4;k++)r("#f4b942",340+k*14,276,4,8);
  r(gt,470,270,13,30);r(gt,474,150,5,120);r(gt,475,118,2,32);
  g.fillStyle=gt;g.beginPath();g.arc(476.5,160,14,0,7);g.fill();
  r("#f4b942",463,158,27,2);r("#d62839",475,114,2,4);
  r(gt,552,282,18,18);r(gt,556,214,10,70);r(gt,553,214,16,5);
  r("#f4b942",558,200,6,12);r("#f4b942",556,204,10,2);
  [[24,44],[255,40],[405,46],[590,44]].forEach(([x,w])=>{
    r("#5b3a29",x,278,w,22);r("#f4b942",x+5,283,w-10,9);
    for(let k=0;k*8<w+8;k++)r(k%2?"#f1f5f9":"#d62839",x-4+k*8,270,8,8);
  });
  g.strokeStyle="#0a1226";g.lineWidth=1;
  const cols=["#d62839","#f4b942","#2a9d6f","#4cc9f0"];
  for(let s=0;s<4;s++){
    g.beginPath();
    for(let u=0;u<=8;u++){
      const x=s*160+u*20,y=36+56*(u/8)*(1-u/8);
      if(u)g.lineTo(x,y);else g.moveTo(x,y);
      if(u>0&&u<8)bulbs.push({x,y:y+1,c:cols[(s*8+u)%4]});
    }
    g.stroke();
  }
}
paintBg();
function sign(x){
  R("#8a94a8",x+47,G-46,4,46);R("#f1f5f9",x,G-72,98,26);R("#1c4fa3",x+2,G-70,94,22);
  ctx.fillStyle="#fff";ctx.font="bold 9px system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("Stresemannstr. 74",x+49,G-59);
}
function brick(b,y){
  const c=b.hit?"#6b7a99":"#d62839",r=b.hit?"#4e5b78":"#f4b942";
  R("#1a1a1a",b.x-2,y-2,S+4,S+4);R(c,b.x,y,S,S);
  R(r,b.x+S/2-3,y,6,S);R(r,b.x,y+S/2-3,S,6);
  if(!b.hit){R(r,b.x+S/2-8,y-6,7,6);R(r,b.x+S/2+1,y-6,7,6)}
}
function car(){
  const x=p.x,y=p.y,f=p.face,hx=x+22;
  R("#1c9fae",x+(f>0?12:16),y+8,24,10);R("#cfe8ff",x+(f>0?14:18),y+9,20,8);
  R("#f2c9a0",hx,y+6,9,10);R("#1a1a1a",f>0?hx+5:hx+2,y+9,2,2);
  R("#d62839",hx-1,y,11,6);R("#f1f5f9",hx-1,y+5,11,2);R("#f1f5f9",f>0?hx-4:hx+10,y+1,3,3);
  R("#1c9fae",x,y+16,52,11);R("#f4b942",f>0?x+49:x,y+18,3,3);R("#d62839",f>0?x:x+49,y+18,3,3);
  ctx.fillStyle="#fff";ctx.font="bold 7px system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("ennooRental",x+26,y+22);
  ctx.fillStyle="#1a1a1a";
  for(const wx of [x+11,x+41]){ctx.beginPath();ctx.arc(wx,y+25,5,0,7);ctx.fill()}
  ctx.fillStyle="#9fb0cc";
  for(const wx of [x+11,x+41]){ctx.beginPath();ctx.arc(wx,y+25,2,0,7);ctx.fill()}
}
function draw(){
  const bx=-Math.round((cam*.5)%W),tt=performance.now();
  ctx.fillStyle="#0c1530";ctx.fillRect(0,0,W,HR);ctx.drawImage(bgc,bx,HR);ctx.drawImage(bgc,bx+W,HR);
  bulbs.forEach((b,i)=>{const c=calm||(Math.floor(tt/450)+i)%3?b.c:"#3a4a6e";R(c,b.x+bx-2,b.y+HR,4,5);R(c,b.x+bx+W-2,b.y+HR,4,5)});
  for(const s of snow){
    if(!calm){s.y+=s.v;s.x+=Math.sin(s.y/30)*.3;if(s.y>G+HR){s.y=-4;s.x=Math.random()*W}}
    R("#f1f5f9",s.x,s.y,s.r,s.r);
  }
  ctx.save();ctx.translate(-Math.round(cam),HR);
  let x0=0;
  for(const q of [...pits,{x:LW,w:0}]){R("#f1f5f9",x0,G,q.x-x0,H-G);R("#dbe4f0",x0,G+8,q.x-x0,H-G-8);x0=q.x+q.w}
  pits.forEach(q=>{R("#070d1a",q.x,G,q.w,H-G);R("#4cc9f0",q.x,G,q.w,4)});
  SIGNS.forEach(sign);
  for(const b of bricks){
    brick(b,b.y-(b.bump>4?(8-b.bump)*2:b.bump*2));
    if(b.hit)tree(b.x+S/2,b.y,b.grow);
  }
  foes.forEach(f=>{if(f.alive)snowman(f)});
  if(!(inv>0&&Math.floor(inv/6)%2))car();
  ctx.restore();
  ctx.font="10px 'Press Start 2P',monospace";ctx.textBaseline="top";
  ctx.fillStyle="#f1f5f9";ctx.textAlign="left";ctx.fillText(L("gifts")+" "+got.length+"/"+N,12,10);
  ctx.fillStyle=left<=10?"#ff6b6b":"#f4b942";ctx.textAlign="center";ctx.fillText(Math.ceil(left)+"s",W/2,10);
  for(let i=0;i<lives;i++)R("#d62839",W-24-i*16,10,10,10);
  bubs.forEach(place);
}
function loop(t){
  const dt=Math.min(100,t-last||16);last=t;
  if(running){acc+=dt;while(acc>=16.67&&running){step();acc-=16.67}}
  draw();requestAnimationFrame(loop);
}
function key(e,v){
  const k=e.key;let m=1;
  if(k==="ArrowLeft"||k==="a"||k==="A")keys.l=v;
  else if(k==="ArrowRight"||k==="d"||k==="D")keys.r=v;
  else if(k===" "||k==="ArrowUp"||k==="w"||k==="W")keys.j=v;
  else m=0;
  if(m&&running)e.preventDefault();
}
addEventListener("keydown",e=>key(e,1));addEventListener("keyup",e=>key(e,0));
addEventListener("blur",()=>{keys.l=keys.r=keys.j=0});
[["bl","l"],["br","r"],["bj","j"]].forEach(([id,k])=>{
  const el=document.getElementById(id);
  el.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=1});
  ["pointerup","pointerleave","pointercancel"].forEach(t=>el.addEventListener(t,()=>keys[k]=0));
});
const nickEl=document.getElementById("nick");
function go(){
  nick=nickEl.value.replace(/[^\p{L}\p{N} _.\-]/gu,"").replace(/^[\s.\-]+/,"").trim().slice(0,14)||L("anon");
  intro.style.display="none";reset();running=true;
}
document.getElementById("start").onclick=go;
nickEl.addEventListener("keydown",e=>{e.stopPropagation();if(e.key==="Enter")go()});
document.getElementById("len").onclick=()=>setLang("en");
document.getElementById("lde").onclick=()=>setLang("de");
reset();setLang(lang);requestAnimationFrame(loop);
</script>
